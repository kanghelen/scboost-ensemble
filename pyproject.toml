[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scboost-ensemble"
version = "0.3.0"
description = "Donor-aware stacking ensemble for scRNA-seq cell-type classification, with 5 leakage-resistant meta-learners, pluggable base/meta learners, and per-fold base classifier caching."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Helen Kang"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5"]
# torch is imported lazily, so the package installs and runs without it. It is required
# only for --base_algo mlp and the --meta_algo torch_* learners.
torch = ["torch>=2.0"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "jupyter",
]

[project.scripts]
scboost = "scboost_ensemble.cli:main"

[project.urls]
Documentation = "https://github.com/kanghelen/scboost-ensemble"
Source       = "https://github.com/kanghelen/scboost-ensemble"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
